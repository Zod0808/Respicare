# Nombre de Objeto: pytest.ini (ai-services)
# Fecha de Creación: 2026-04-25
# Propietario: Cesar Fabian Chavez Linares
# Requerimiento: RNF-012 - Cobertura de pruebas (calidad verificable del código)
# Descripción: Configuración de pytest con --cov-fail-under=80, que exige un
# umbral mínimo de cobertura verificable en ai-services.

[pytest]
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --strict-markers
    --strict-config
    --cov=.
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml:coverage.xml
    --junitxml=junit.xml
    --cov-fail-under=80
    --asyncio-mode=auto
    --maxfail=5
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow tests
    ai: AI/ML specific tests
    performance: Performance tests
    benchmark: Benchmark tests
    security: Security tests
    circuit_breaker: Circuit breaker tests
    repository: Repository pattern tests
    strategy: Strategy pattern tests
    decorator: Decorator pattern tests
    factory: Factory pattern tests
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
